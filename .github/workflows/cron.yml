name: 'Trigger Mirror Check Cron Job'

on:
  schedule:
    # Runs every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  trigger-vercel-endpoint:
    runs-on: ubuntu-latest
    steps:
      - name: 'Trigger Vercel Python API Endpoint'
        run: |
          # The VERCEL_DEPLOYMENT_URL secret must be set in the GitHub repo settings.
          # It should be the full URL to your deployed Vercel application.
          # Example: https://your-project-name.vercel.app
          if [ -z "${{ secrets.VERCEL_DEPLOYMENT_URL }}" ]; then
            echo "Error: VERCEL_DEPLOYMENT_URL secret is not set."
            echo "Please add it to your repository's secrets."
            exit 1
          fi

          # Debugging: Print the full URL being called
          echo "Pinging URL: ${{ secrets.VERCEL_DEPLOYMENT_URL }}/api/mirror-check"

          # Use curl to send a simple GET request to trigger the serverless function.
          # The -f flag makes curl fail silently on server errors (HTTP status code >= 400).
          # Adding --verbose to get more detailed output for debugging.
          curl -f --verbose "${{ secrets.VERCEL_DEPLOYMENT_URL }}/api/mirror-check"
